name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  manifests:
    name: Both manifests agree, and every repository is a plugin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Check the manifests against each other and against GitHub
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/check-manifests.py

  parsers:
    name: The real parsers accept the catalog
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install the current Claude Code and Codex CLIs
        # Unpinned on purpose: what matters is the parser users have today.
        run: npm install -g @anthropic-ai/claude-code @openai/codex

      - name: Claude Code validates its manifest
        run: claude plugin validate .

      - name: Codex registers the catalog from this checkout
        # A single bad value fails the whole manifest for everyone who has the
        # marketplace registered, and only Codex itself knows what it accepts.
        env:
          CODEX_HOME: ${{ runner.temp }}/codex-home
        run: |
          mkdir -p "$CODEX_HOME"
          codex plugin marketplace add "$PWD"
          codex plugin list
